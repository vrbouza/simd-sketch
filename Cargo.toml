[package]
name = "simd-sketch"
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ragnargrootkoerkamp/simd-sketch"
keywords = ["sketch", 'minhash', "simd", "dna", "bioinformatics"]
categories = ["compression", "data-structures", "science::bioinformatics"]
authors = ["Ragnar Groot Koerkamp"]
description = "A SIMD-accelerated library to compute a b-bit bottom-h sketch"

[profile.release]
opt-level = 3
panic = "abort"
# strip = true
debug = true
incremental = true
# slow!
lto = true
# codegen-units = 1

[profile.dev]
opt-level = 3
panic = "abort"
lto = 'thin'
debug-assertions = false
overflow-checks = false

[profile.test]
debug-assertions = true
overflow-checks = true


[dependencies]
clap = { version = "4.5.31", default-features = false, features = ["std", "derive"] }
itertools = "0.14.0"
wide = "0.7.32"
log = "0.4.27"
bincode = "2.0.1"

packed-seq = { version = "4.3.0", default-features = false }
mem_dbg = "0.3.2"

[patch.crates-io]
packed-seq = { path = "../packed-seq" }

[features]
default = ["clap/default"]

[dev-dependencies]
rand = "0.9.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
packed-seq = { version = "4.3.0", default-features = false, features = ["file_io"] }
# seq-hash = "0.1.1"
seq-hash.git = "https://github.com/rust-seq/seq-hash"
rayon = "1.10.0"
env_logger = { version = "0.11.8", default-features = false }
indicatif = { version = "0.18.0", features = ["rayon"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
packed-seq = { version = "4.3.0", default-features = false, features = ["scalar"] }
